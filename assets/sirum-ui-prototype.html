<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sirum UI prototype</title>
<!--
Sirum UI prototype (plain HTML/CSS/JS, no dependencies). Open in a browser, ideally at phone width.
Integration map (state key -> Sirum setting):
  nav -> device.navMode ('bottom'|'side')       lay -> device.libraryLayout (2|3)
  view -> device.viewMode ('grid'|'list')        grid -> device.gridSize (2|3|4)
  imp -> device.importMethod ('scan'|'manual')   order -> library.orderMode ('recent'|'fixed')
  sort/dir -> library.sort / library.sortDirection   pm -> reader.percentageMode
  theme/acc/afont -> device.theme / device.accent / device.appFont   badges/details -> device.showBadges / device.showDetails
  rd -> reader.style (default reading style)   B[i].st -> reader.book.<documentId> (per-book overrides, changed fields only)
Screens: Library, History, Import, Settings. Shared chrome: bottom nav, side drawer, filter sheet, permission dialog.
State is in memory only. In the app it comes from the settings table.
-->
<style>
:root{--bg:#000;--sf:#1c1c1e;--sf2:#2c2c30;--tx:#f2f2f2;--mu:#9a9aa2;--ac:#52c98b;--acb:#0e6b3a;--ln:#333;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#f6f6f8;--sf:#fff;--sf2:#e9e9ee;--tx:#18181b;--mu:#62626c;--ln:#d8d8de;color-scheme:light}}
[data-theme=light]{--bg:#f6f6f8;--sf:#fff;--sf2:#e9e9ee;--tx:#18181b;--mu:#62626c;--ln:#d8d8de;color-scheme:light}
[data-theme=sepia]{--bg:#f4ecd8;--sf:#fbf5e6;--sf2:#e8dcc0;--tx:#4a3a22;--mu:#7d6a4c;--ln:#d9ccaa;color-scheme:light}
[data-theme=dark]{--bg:#000;--sf:#1c1c1e;--sf2:#2c2c30;--tx:#f2f2f2;--mu:#9a9aa2;--ln:#333;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#111;font:15px/1.35 system-ui,sans-serif;color:var(--tx)}
.app{position:relative;max-width:430px;height:100vh;height:100dvh;margin:auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
#root{display:contents}
button{font:inherit;color:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;align-items:center;gap:4px;padding:14px 12px 8px 16px}
.bar h1{flex:1;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.ib{background:none;border:0;padding:8px;border-radius:50%;display:grid;place-items:center}
.pill{font-size:13px;font-weight:500;background:var(--sf2);border-radius:14px;padding:3px 10px}
.q{flex:1;min-width:0;background:var(--sf2);border:0;border-radius:20px;padding:10px 14px;color:var(--tx);font:inherit}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--ln);padding:0 8px}
.tab{background:none;border:0;padding:12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ac);border-color:var(--ac)}
main{flex:1;overflow-y:auto;padding:12px 12px 24px}
.mu,small{color:var(--mu)}
.ell{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:10px}
.card{position:relative;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--sf);text-align:left;min-width:0}
.cv{aspect-ratio:2/3;display:grid;place-items:center;font:600 42px Georgia,serif;color:rgba(255,255,255,.55);background:linear-gradient(160deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 14%))}
.bdg{position:absolute;top:6px;left:6px;display:flex;font-size:12px;font-weight:600;border-radius:5px;overflow:hidden}
.bdg span{padding:2px 6px}.bdg .f{background:#f1b4b4;color:#5a1a1a}.bdg .p{background:#9be3b4;color:#0a3a1f}
.nd{position:absolute;top:6px;right:6px;font-size:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:5px;padding:2px 5px}
.card .t{position:absolute;left:0;right:0;bottom:0;padding:28px 46px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-weight:600;font-size:13px}
.pl{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:10px;background:var(--acb);color:#fff;display:grid;place-items:center}
.pl .i{width:18px;height:18px}
.g4 .pl{display:none}.g4 .t{padding-right:8px;font-size:11px}
.cap{padding:10px 12px}.cap b,.row b{display:block}.cap small,.row small{display:block}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:8px;margin-bottom:8px;border:0;border-radius:10px;background:var(--sf)}
.row .cv{width:46px;flex:none;font-size:18px;border-radius:5px}
.row input{accent-color:var(--ac);width:20px;height:20px}
.bar2{height:4px;background:var(--sf2);border-radius:2px;margin:6px 0}.bar2 i{display:block;height:100%;background:var(--ac);border-radius:2px}
.bn{display:flex;background:var(--sf);padding:10px 4px 14px}
.bn button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;display:grid;gap:4px;justify-items:center}
.bn .ic{padding:4px 18px;border-radius:16px}.bn .on{color:var(--tx)}.bn .on .ic{background:var(--acb);color:var(--tx)}
.sc{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.sc.s2{z-index:7}
.open .sc.d,.sh-open .sc.s2{opacity:1;pointer-events:auto}
.dr{position:absolute;top:0;bottom:0;left:0;width:78%;background:var(--sf);transform:translateX(-100%);transition:transform .2s;z-index:6;overflow-y:auto}
.open .dr{transform:none}
.dt{font-size:22px;font-weight:600;padding:20px}
.di{display:flex;align-items:center;gap:20px;width:100%;padding:14px 20px;background:none;border:0;font-size:16px;text-align:left}
.di.on{background:var(--acb);color:var(--tx)}
.dh{color:var(--mu);font-size:14px;padding:16px 20px 4px}
hr{border:0;border-top:1px solid var(--ln);margin:8px 0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;background:var(--sf);border-radius:20px 20px 0 0;padding:18px 16px;z-index:8;transform:translateY(105%);transition:transform .2s}
.sh-open .sheet{transform:none}
.sheet h3,.set h3{font-size:13px;font-weight:500;color:var(--mu);margin:16px 0 8px}
.chip{background:none;border:1px solid var(--ln);border-radius:16px;padding:6px 12px;margin:0 6px 6px 0}
.chip.on{background:var(--acb);border-color:var(--ac);color:var(--tx)}
.chip:disabled{opacity:.4;cursor:default}
.set{background:var(--sf);border-radius:14px;padding:14px;margin-bottom:12px}
.set h2{font-size:16px;font-weight:600}.set p{color:var(--mu);font-size:13px;margin:4px 0 10px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:20px;padding:10px 18px;font-weight:600}
.btn.g{background:none;color:var(--ac)}
.seg{margin-bottom:12px}
.dlg{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:9}
.dlg>div{background:var(--sf);border-radius:20px;padding:20px;margin:24px}
.dlg h2{font-size:18px;margin-bottom:8px}.dlg p{color:var(--mu)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#e8e8ec;color:#111;padding:12px 16px;border-radius:12px;z-index:10}
.si{display:flex;gap:20px;align-items:center;width:100%;padding:16px 8px;background:none;border:0;text-align:left}
.si .i{color:var(--ac);flex:none}.si b{display:block;font-size:17px;font-weight:500}
.sl{display:block;margin:12px 0 4px}.sl span{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.sl input{width:100%;accent-color:var(--ac)}.sl input[type=color]{height:36px;border:0;background:none;padding:0}
.rprev{border-radius:12px;margin:12px 0}main.rprev{border-radius:0;margin:0}
.foot{padding:8px 16px 14px;color:var(--mu);font-size:13px;text-align:center;background:var(--sf)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
<symbol id="lib" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h10"/></symbol>
<symbol id="hist" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 2.2"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="palette" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="15.5" cy="10" r="1"/></symbol>
<symbol id="reader" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></symbol>
<symbol id="storage" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/></symbol>
<symbol id="sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14-4L4 9M4 13a8 8 0 0014 4l2-2M4 4v5h5M20 20v-5h-5"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
</svg>

<div class="app" id="app"><div id="root"></div></div>
<input type="file" id="fi" multiple hidden accept=".txt,.epub,.pdf,text/plain,application/epub+zip,application/pdf">

<script>
/* ===== DATA (sample books; the real app reads documents + reading_progress from SQLite) ===== */
const D=[['The Hollow Crown','A. Marlowe','epub',.36,20],['Salt & Static','R. Okafor','epub',.8,200],['Orbit of Ash','J. Venkat','epub',0,330],['A Quiet Archive','M. Lindqvist','txt',.12,160],['Paper Lanterns','H. Sato','epub',1,10],['Northbound','D. Reyes','pdf',.55,260],['The Glass Orchard','E. Brandt','epub',.07,120],['Nine Winters','K. Abara','txt',0,300],['Field Notes','S. Moreau','pdf',.9,50],['Low Tide Letters','T. Okonkwo','epub',.23,180]];
let clock=D.length;
const B=D.map(([t,a,f,p,h],i)=>({id:i,t,a,f,p,h,added:i,read:p?D.length-i:0,opened:D.length-i,local:i!=6}));
const FAKE=[['Moonlit_Garden.epub','/Download'],['field-notes.txt','/Documents'],['manual_v2.pdf','/Download'],['diary_2019.txt','/Documents/old'],['Atlas_of_Salt.epub','/Books']];

/* ===== STATE ===== */
const S={scr:'library',nav:'bottom',lay:3,view:'grid',grid:3,order:'recent',sort:'added',dir:'desc',imp:'scan',perm:false,tab:'all',fmt:[],st:[],q:'',find:false,dlg:0,scan:null,log:[],toast:'',sub:null,badges:1,details:1,theme:'system',acc:'green',afont:'system',pm:'book',scope:'all',cur:0,rd:{fam:'serif',wt:400,size:18,lh:1.6,mar:20,bg:'#121212',tx:'#e6e6e6'}};

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s),app=$('#app'),root=$('#root');
const I=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const ib=(act,ic,lb)=>`<button class="ib" aria-label="${lb}" data-act="${act}">${I(ic)}</button>`;
const stat=b=>b.p==0?'unread':b.p>=.99?'done':'going';
const pct=b=>Math.round(b.p*100);
const seg=(k,o,dis)=>o.map(([v,l])=>`<button class="chip${S[k]==v?' on':''}" data-set="${k}" data-v="${v}"${dis?' disabled':''}>${l}</button>`).join('');
const chip=(k,v,l)=>`<button class="chip${S[k].includes(v)?' on':''}" data-tog="${k}" data-v="${v}">${l}</button>`;
const bar=(t,x='',back)=>`<div class="bar">${back?ib('back','back','Back'):S.nav=='side'?ib('drawer','menu','Menu'):''}<h1>${t}</h1>${x}</div>`;

function vis(){
  const q=S.q.toLowerCase();
  const r=B.filter(b=>(S.tab=='all'||b.f==S.tab)&&(!S.fmt.length||S.fmt.includes(b.f))&&(!S.st.length||S.st.includes(stat(b)))&&(b.t+' '+b.a).toLowerCase().includes(q));
  if(S.order=='recent')return r.sort((a,b)=>b.opened-a.opened);
  const k={title:b=>b.t,author:b=>b.a,added:b=>b.added,lastRead:b=>b.read,progress:b=>b.p}[S.sort],d=S.dir=='asc'?1:-1;
  return r.sort((a,b)=>k(a)>k(b)?d:k(a)<k(b)?-d:0);
}

/* ===== COMPONENT: book card (caption style at 2 columns, overlay style at 3 to 4) and list row ===== */
const cv=b=>`<div class="cv" style="--h:${b.h}">${b.t[0]}</div>`;
const nd=b=>b.local?'':'<span class="nd">Not on device</span>';
const bdg=b=>(S.badges?`<div class="bdg"><span class="f">${b.f.toUpperCase()}</span>${b.p?`<span class="p">${pct(b)}</span>`:''}</div>`:'')+nd(b);
const card=b=>S.grid<3
  ?`<button class="card" aria-label="${b.t}" data-open="${b.id}">${cv(b)}${bdg(b)}${S.details?`<div class="cap"><b class="ell">${b.t}</b><small class="ell">${b.a}</small></div>`:''}</button>`
  :`<button class="card" aria-label="${b.t}" data-open="${b.id}">${cv(b)}${bdg(b)}${S.details?`<div class="t ell">${b.t}</div>`:''}<span class="pl">${I('play')}</span></button>`;
const row=b=>`<button class="row" data-open="${b.id}">${cv(b)}<span style="flex:1;min-width:0;text-align:left"><b class="ell">${b.t}</b><small>${b.a} · ${b.f.toUpperCase()}${b.local?'':' · Not on this device'}</small><div class="bar2"><i style="width:${pct(b)}%"></i></div></span><small>${pct(b)}%</small></button>`;

/* ===== SCREEN: Library ===== */
function results(){
  const v=vis();
  if(!v.length)return'<p class="mu">No books match your filters.</p>';
  return S.view=='list'?v.map(row).join(''):`<div class="grid g${S.grid}" style="--c:${S.grid}">${v.map(card).join('')}</div>`;
}
function libraryScr(){
  const head=S.find?'<input id="q" class="q" placeholder="Search title or author" value="'+S.q+'">':`<h1>${S.nav=='side'?'My books':'Library'} <span class="pill">${vis().length}</span></h1>`;
  const tabs=S.nav=='bottom'?`<div class="tabs">${[['all','All'],['epub','EPUB'],['txt','TXT'],['pdf','PDF']].map(([k,l])=>`<button class="tab${S.tab==k?' on':''}" data-tab="${k}">${l} <small class="pill">${B.filter(b=>k=='all'||b.f==k).length}</small></button>`).join('')}</div>`:'';
  return`<div class="bar">${S.nav=='side'?ib('drawer','menu','Menu'):''}${head}${ib('find','search','Search')}${ib('sheet','filter','View, sort and filter')}</div>${tabs}<main id="res">${results()}</main>`;
}

/* ===== SCREEN: History ===== */
const historyScr=()=>bar('History')+`<main>${B.filter(b=>b.p).sort((a,b)=>b.read-a.read).map(row).join('')}</main>`;

/* ===== SCREEN: Import (storage access, scan device, manual import) ===== */
function scanPanel(){
  const c=S.scan;
  const top=`<section class="set"><h2>Storage access: ${S.perm?'granted':'not granted'}</h2><p>Sirum looks for .txt, .epub and .pdf files in the folder you allow. Your files stay on this device.</p><button class="btn" data-act="scan">${S.perm?'Scan now':'Allow access and scan'}</button></section>`;
  if(!c)return top;
  return top+`<div class="bar2"><i style="width:${c.pct}%"></i></div><p class="mu" style="margin-bottom:8px">${c.done?`Found ${c.files.length} files`:'Scanning…'}</p>`
    +c.files.map((f,i)=>`<label class="row"><input type="checkbox" data-sel="${i}"${f.on?' checked':''}><span style="flex:1;min-width:0"><b class="ell">${f.n}</b><small>${f.p}</small></span><small>${f.n.split('.').pop().toUpperCase()}</small></label>`).join('')
    +(c.done&&c.files.length?`<button class="btn" data-act="addsel">Add ${c.files.filter(f=>f.on).length} selected</button>`:'');
}
const manualPanel=()=>`<section class="set"><h2>Choose files</h2><p>Opens the system file picker. No storage permission needed.</p><button class="btn" data-act="pick">Choose files</button></section>${S.log.map(l=>`<p class="mu">${l}</p>`).join('')}`;
const importScr=()=>bar('Import')+`<main><div class="seg">${seg('imp',[['scan','Scan device'],['manual','Manual import']])}</div>${S.imp=='scan'?scanPanel():manualPanel()}</main>`;

/* ===== SCREEN: Settings (categorized hub with sub-pages) ===== */
const FF={serif:'Georgia,serif',sans:'system-ui,sans-serif',mono:'ui-monospace,Menlo,monospace'};
const AF={system:'system-ui,sans-serif',serif:'Georgia,serif',humanist:"'Gill Sans','Trebuchet MS',sans-serif",mono:'ui-monospace,Menlo,monospace'};
const AC={green:['#52c98b','#0e6b3a','#0e7a46','#bfeacf'],purple:['#b9a7ff','#4a3f8f','#5b46c9','#ddd5ff'],blue:['#6cb6ff','#17508f','#1b66b8','#cfe4ff']};
const PRE=[['Dark','#121212','#e6e6e6'],['Light','#fafafa','#1a1a1a'],['Sepia','#f4ecd8','#4a3a22']];
const SAMPLE='<p>The lamp on the quay had been lit for an hour before anyone noticed the boat was gone. Marta counted the ropes twice and found them all in place.</p><p style="margin-top:.8em">“It didn’t drift,” she said. “Somebody took it, and they wanted us to see the lamp.”</p>';
const SUBS=[['appearance','palette','Appearance','Theme, accent color, app font'],['library','lib','Library','Layout, order, display'],['reader','reader','Reader','Reading display, progress'],['import','storage','Import and storage','Import method, storage access'],['sync','sync','Sync','Account, sync status'],['about','info','About','Sirum prototype v0.1']];

/* Reading style: global default S.rd, optional per-book overrides B[i].st (only changed fields). */
const rs=b=>({...S.rd,...(b.st||{})});
const ctx=()=>S.scr=='reader'?B[S.cur]:null;
const shown=()=>{const b=ctx();return b?rs(b):S.rd};
const view=()=>{const b=ctx();return b&&S.scope=='book'?rs(b):S.rd};
const tgt=()=>{const b=ctx();return b&&S.scope=='book'?(b.st=b.st||{}):S.rd};
const rdCss=r=>`background:${r.bg};color:${r.tx};padding:16px ${r.mar}px;font-family:${FF[r.fam]};font-weight:${r.wt};font-size:${r.size}px;line-height:${r.lh}`;
function rdc(){
  const v=view();
  const ch=(k,o)=>o.map(([x,l])=>`<button class="chip${v[k]==x?' on':''}" data-rk="${k}" data-v="${x}">${l}</button>`).join('');
  const sl=(k,l,a,z,st)=>`<label class="sl"><span>${l} <b id="v-${k}">${v[k]}</b></span><input type="range" data-rd="${k}" min="${a}" max="${z}" step="${st}" value="${v[k]}"></label>`;
  const co=(k,l)=>`<label class="sl"><span>${l}</span><input type="color" data-rd="${k}" value="${v[k]}"></label>`;
  return'<h3>Preset</h3>'+PRE.map(([n,a,z])=>`<button class="chip" data-pre="${a},${z}">${n}</button>`).join('')
   +'<h3>Font</h3>'+ch('fam',[['serif','Serif'],['sans','Sans'],['mono','Mono']])
   +'<h3>Weight</h3>'+ch('wt',[[400,'Regular'],[500,'Medium'],[700,'Bold']])
   +sl('size','Size',14,28,1)+sl('lh','Line height',1.2,2.2,.1)+sl('mar','Margins',0,48,2)+co('bg','Background color')+co('tx','Text color');
}
function settingsScr(){
  const sub=S.sub,s=(h,p,b)=>`<section class="set"><h2>${h}</h2><p>${p}</p>${b}</section>`;
  if(!sub)return bar('Settings')+'<main>'+SUBS.map(([k,ic,t,d])=>`<button class="si" data-sub="${k}">${I(ic)}<span><b>${t}</b><small>${d}</small></span></button>`).join('')+'</main>';
  const pg={
    appearance:()=>s('Color theme','Applies to the whole app.',seg('theme',[['system','System'],['dark','Dark'],['light','Light'],['sepia','Sepia']]))
      +s('Accent color','Buttons, tabs and highlights.',seg('acc',[['green','Green'],['purple','Purple'],['blue','Blue']]))
      +s('App font','Menus and library. The reading font is set under Reader.',seg('afont',[['system','System'],['serif','Serif'],['humanist','Humanist'],['mono','Mono']])),
    library:()=>s('Navigation layout','Bottom bar, or a hidden side drawer.',seg('nav',[['bottom','Bottom bar'],['side','Side drawer']]))
      +s('Default library layout','Starting layout only. Change view and grid size anytime from the filter button.',seg('lay',[[2,'2 columns'],[3,'3 columns']]))
      +s('Library order','Whether opening a book moves it to the top of the library.',seg('order',[['recent','Recently opened first'],['fixed','Fixed order']]))
      +s('Format and progress badges','The format label and progress percent on covers.',seg('badges',[[1,'Show'],[0,'Hide']]))
      +s('Title and author','Shown under or over covers in grid view. List view always shows them.',seg('details',[[1,'Show'],[0,'Hide']])),
    reader:()=>s('Progress display','Show progress for the whole book or the current chapter.',seg('pm',[['book','Whole book'],['chapter','Current chapter']]))
      +s('Reading display','Default for all books. Open Aa inside a book to give that book its own style.',rdc()+`<div class="rprev" style="${rdCss(S.rd)}">${SAMPLE}</div>`),
    import:()=>s('Import method','How you add files to your library.',seg('imp',[['scan','Scan device'],['manual','Manual import']]))
      +s('Storage access',`Status: <b>${S.perm?'granted':'not granted'}</b>. On Android this is a folder you pick. iOS has no scan, so use manual import.`,`<button class="btn${S.perm?' g':''}" data-act="perm">${S.perm?'Revoke access':'Allow storage access'}</button>`),
    sync:()=>s('Account','You are not signed in. Reading works fully offline. Sign in with Google to sync progress, bookmarks and settings. Only metadata syncs; book files stay on this device.','<button class="btn" disabled>Sign in with Google</button>'),
    about:()=>s('Sirum','Prototype v0.1. Offline-first reader for EPUB, TXT and PDF.','')
  };
  return bar(SUBS.find(x=>x[0]==sub)[2],'',1)+'<main>'+pg[sub]()+'</main>';
}

/* ===== SCREEN: Reader (sample text; shows per-book style) ===== */
function readerScr(){
  const b=B[S.cur];
  return`<div class="bar">${ib('back','back','Back')}<h1 class="ell">${b.t}</h1><button class="ib" aria-label="Display options" data-act="sheet">Aa</button></div><main class="rprev" id="rm" style="${rdCss(rs(b))}">${SAMPLE}${SAMPLE}${SAMPLE}</main><div class="foot">${S.pm=='chapter'?'Ch. 3 of 12 · 42%':'37% of book'}${b.st&&Object.keys(b.st).length?' · custom style':''}</div>`;
}
function rdSheet(){
  const b=B[S.cur],own=b.st&&Object.keys(b.st).length;
  return`<div class="sc s2" data-act="sheet"></div><div class="sheet"><b>Reading display</b><div style="margin-top:10px">${seg('scope',[['all','All books'],['book','This book only']])}</div>`
   +(S.scope=='book'?`<p class="mu">${own?'This book has its own style.':'Changes apply to this book only.'}</p>${own?'<button class="chip" data-act="resetbook">Reset this book</button>':''}`:'<p class="mu">Changes become the default for all books.</p>')
   +rdc()+'<p style="margin-top:12px"><button class="btn" data-act="sheet">Done</button></p></div>';
}
function applyTheme(){
  const h=document.documentElement;
  if(S.theme=='system')h.removeAttribute('data-theme');else h.dataset.theme=S.theme;
  const lt=S.theme=='light'||S.theme=='sepia'||(S.theme=='system'&&matchMedia('(prefers-color-scheme: light)').matches),a=AC[S.acc];
  h.style.setProperty('--ac',a[lt?2:0]);h.style.setProperty('--acb',a[lt?3:1]);
  document.body.style.fontFamily=AF[S.afont];
}

/* ===== CHROME: bottom nav, side drawer, filter sheet, permission dialog, toast ===== */
const bottomNav=()=>`<nav class="bn">${[['library','lib','Library'],['history','hist','History'],['import','add','Import'],['settings','cog','Settings']].map(([k,ic,l])=>`<button class="${S.scr==k?'on':''}" data-go="${k}"><span class="ic">${I(ic)}</span>${l}</button>`).join('')}</nav>`;
function drawer(){
  const it=(ic,l,a,on)=>`<button class="di${on?' on':''}" ${a}>${I(ic)}${l}</button>`,lb=S.scr=='library';
  return`<div class="sc d" data-act="drawer"></div><aside class="dr"><div class="dt">Sirum</div>`
   +it('lib','My books','data-tab="all"',lb&&S.tab=='all')+'<div class="dh">Formats</div>'
   +['epub','txt','pdf'].map(f=>it('lib',f.toUpperCase(),`data-tab="${f}"`,lb&&S.tab==f)).join('')
   +'<hr>'+it('hist','History','data-go="history"',S.scr=='history')+it('add','Import','data-go="import"',S.scr=='import')+it('cog','Settings','data-go="settings"',S.scr=='settings')+'</aside>';
}
const sheet=()=>S.scr=='reader'?rdSheet():filterSheet();
function filterSheet(){
  const dis=S.order=='recent';
  return`<div class="sc s2" data-act="sheet"></div><div class="sheet"><b>View, sort and filter</b>`
   +`<h3>View</h3>${seg('view',[['grid','Grid'],['list','List']])}`
   +`<h3>Grid size</h3>${seg('grid',[[2,'2×2'],[3,'3×3'],[4,'4×4']],S.view=='list')}`
   +`<h3>Sort${dis?' (off while the library order is Recently opened first)':''}</h3>${seg('sort',[['title','Title'],['author','Author'],['added','Date added'],['lastRead','Last read'],['progress','Progress']],dis)}${seg('dir',[['asc','Ascending'],['desc','Descending']],dis)}`
   +`<h3>Format</h3>${['epub','txt','pdf'].map(f=>chip('fmt',f,f.toUpperCase())).join('')}`
   +`<h3>Status</h3>${[['unread','Unread'],['going','In progress'],['done','Finished']].map(([v,l])=>chip('st',v,l)).join('')}`
   +`<p style="margin-top:12px"><button class="btn" data-act="sheet">Done</button></p></div>`;
}
const dialog=()=>S.dlg?`<div class="dlg"><div><h2>Allow Sirum to access files?</h2><p>Sirum needs access to a folder to find .txt, .epub and .pdf files. On Android you will pick that folder in the system picker.</p><div style="text-align:right;margin-top:16px"><button class="btn g" data-act="deny">Don’t allow</button> <button class="btn" data-act="allow">Allow</button></div></div></div>`:'';

/* ===== RENDER ===== */
function render(){
  const scr={library:libraryScr,history:historyScr,import:importScr,settings:settingsScr,reader:readerScr}[S.scr]();
  root.innerHTML=scr+(S.scr=='reader'?'':S.nav=='bottom'?bottomNav():drawer())+sheet()+dialog()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
}
let tt,tm;
function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},2200)}

/* ===== ACTIONS ===== */
const add=(name,ext)=>B.push({id:B.length,t:name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),a:'Unknown author',f:ext,p:0,h:[...name].reduce((a,c)=>a+c.charCodeAt(0),0)%360,added:++clock,opened:++clock,read:0,local:true});
function startScan(){
  clearInterval(tm);S.scan={pct:0,files:[],done:false};
  tm=setInterval(()=>{const c=S.scan;c.pct+=20;const f=FAKE[c.pct/20-1];if(f)c.files.push({n:f[0],p:f[1],on:true});if(c.pct>=100){c.done=true;clearInterval(tm)}render()},350);
  render();
}
const act={
  drawer:()=>app.classList.toggle('open'),
  sheet:()=>app.classList.toggle('sh-open'),
  find:()=>{S.find=!S.find;if(!S.find)S.q=''},
  perm:()=>{if(S.perm){S.perm=false;toast('Storage access revoked')}else S.dlg=1},
  scan:()=>{if(S.perm)startScan();else S.dlg=1},
  deny:()=>{S.dlg=0},
  allow:()=>{S.perm=true;S.dlg=0;if(S.scr=='import'&&S.imp=='scan')startScan();else toast('Storage access granted')},
  addsel:()=>{const f=S.scan.files.filter(f=>f.on);f.forEach(x=>add(x.n,x.n.split('.').pop()));S.scan=null;S.scr='library';toast(`Added ${f.length} book${f.length==1?'':'s'}`)},
  pick:()=>$('#fi').click(),
  back:()=>{if(S.scr=='reader'){S.scr='library';app.classList.remove('sh-open')}else S.sub=null},
  resetbook:()=>{B[S.cur].st=null}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-set],[data-tog],[data-open],[data-go],[data-tab],[data-sub],[data-rk],[data-pre]');
  if(!t)return;
  const d=t.dataset,n=v=>isNaN(v)?v:+v;
  if(d.set){S[d.set]=n(d.v);if(d.set=='lay'){S.grid=S.lay;S.view='grid'}if(['theme','acc','afont'].includes(d.set))applyTheme()}
  else if(d.rk)tgt()[d.rk]=n(d.v);
  else if(d.pre){const[a,z]=d.pre.split(',');Object.assign(tgt(),{bg:a,tx:z})}
  else if(d.sub)S.sub=d.sub;
  else if(d.tog){const a=S[d.tog],i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1)}
  else if(d.open!==undefined){const b=B[+d.open];if(!b.local){toast(`Import “${b.t}” to continue reading`);return}if(S.order=='recent')b.opened=++clock;S.cur=b.id;S.scr='reader'}
  else if(d.go){S.scr=d.go;S.sub=null;app.classList.remove('open')}
  else if(d.tab){S.tab=d.tab;S.scr='library';app.classList.remove('open')}
  else if(d.act){act[d.act]();if(d.act=='drawer'||d.act=='sheet')return}
  render();
  if(d.act=='find'&&S.find)$('#q').focus();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id=='q'){S.q=el.value;$('#res').innerHTML=results()}
  else if(el.dataset.rd){
    const k=el.dataset.rd;tgt()[k]=el.type=='range'?+el.value:el.value;
    const l=$('#v-'+k);if(l)l.textContent=el.value;
    document.querySelectorAll('.rprev').forEach(x=>x.setAttribute('style',rdCss(shown())));
  }
});
document.addEventListener('change',e=>{const i=e.target.dataset.sel;if(i!==undefined){S.scan.files[+i].on=e.target.checked;render()}});

/* Manual import: reads real files from the browser. For .txt it reports the length in UTF-16 units, the same unit Sirum uses for offsets. */
$('#fi').onchange=async e=>{
  S.log=[];
  for(const f of [...e.target.files]){
    const x=f.name.split('.').pop().toLowerCase();
    if(!['txt','epub','pdf'].includes(x)){S.log.push(`Skipped ${f.name} (unsupported type)`);continue}
    const n=x=='txt'?` · ${(await f.text()).length} characters`:'';
    add(f.name,x);S.log.push(`Added ${f.name} · ${(f.size/1024).toFixed(1)} KB${n}`);
  }
  e.target.value='';render();
};
applyTheme();render();
</script>
</body>
</html>
