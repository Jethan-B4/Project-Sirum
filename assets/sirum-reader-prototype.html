<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sirum reader prototype</title>
<!--
Sirum reader prototype (plain HTML/CSS/JS, no dependencies). Open in a browser, ideally at phone width.
Integration map (state key -> Sirum setting / data):
  flow -> reader.style.flow ('auto'|'paged'|'scrolled')   size -> reader.style.size (%)   mg -> reader.style.mar (%)
  al -> reader.style.align ('left'|'justify')              th / cbg / ctx -> reader.style.bg / tx (theme swatches, custom colors)
  br -> device.readerBrightness                            hist -> device.searchHistory (last 10)
  bm -> bookmarks table   ANN -> highlights table (notes)  S.ch + position -> reading_progress (chapter_index, char_offset)
Views: reader (top bar, text, bottom scrubber), overflow menu, contents panel (3 tabs), display popup, in-book search.
State is in memory only. Sample text is invented.
-->
<style>
:root{--ch:#2b2b2d;--ch2:#3b3b3e;--tx:#f2f2f2;--mu:#a0a0a8;--ac:#b9a7ff;--acb:#4a4560;--co:#f08a84;--ln:#444;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#111;font:15px/1.4 system-ui,sans-serif;color:var(--tx)}
.app{position:relative;max-width:430px;height:100vh;height:100dvh;margin:auto;overflow:hidden;display:flex;flex-direction:column;background:var(--rb);--rb:#000;--rt:#e6e6e6;--sz:1;--mg:2%;--al:justify}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ell{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top{display:flex;align-items:center;padding:12px 6px 10px;background:var(--ch);z-index:3}
.top h1{flex:1;font-size:19px;font-weight:600;padding:0 8px}
.ib{min-width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600}
#txt{flex:1;overflow-y:auto;background:var(--rb);color:var(--rt);padding:8px var(--mg) 24px;font-size:calc(17px*var(--sz));line-height:1.6}
#txt.pg{overflow:hidden}
#txt h2{font-variant:small-caps;font-size:1.6em;letter-spacing:.04em;font-weight:600;line-height:1.25;border-bottom:3px solid currentColor;padding:8px 0 14px;margin:24px 0 28px;opacity:.9}
#txt p{margin:0 0 1.2em;text-align:var(--al)}
.bot{background:var(--ch);padding:14px 20px 18px;z-index:3}
.bt{display:flex;justify-content:space-between;gap:12px;font-size:17px;font-weight:600;margin-bottom:10px}
input[type=range]{width:100%;accent-color:var(--ac)}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4}
.sc{position:absolute;inset:0;z-index:5}.sc.dim{background:rgba(0,0,0,.55)}
.menu{position:absolute;top:58px;right:10px;width:62%;background:var(--ch2);border-radius:8px;padding:6px 0;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.mi{display:block;width:100%;text-align:left;padding:16px 22px;font-size:17px}
.pn{position:absolute;top:0;bottom:0;right:0;width:78%;background:var(--ch);z-index:7;display:flex;flex-direction:column}
.pt{display:flex;border-bottom:1px solid var(--ln);padding-top:12px}
.ptab{flex:1;height:56px;display:grid;place-items:center;color:var(--mu);border-bottom:3px solid transparent}
.ptab.on{color:var(--ac);border-color:var(--ac)}
.pb{flex:1;overflow-y:auto}
.li{display:block;width:100%;text-align:left;padding:18px 24px;font-size:16px}
.li.on{background:var(--acb);color:var(--ac)}
.li small,.mu{color:var(--mu);display:block;font-size:13px}
.empty{padding:32px 24px;color:var(--mu)}
.disp{position:absolute;top:60px;left:12%;right:10px;background:var(--ch2);border-radius:8px;padding:6px 0 12px;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.sec{padding:14px 20px;border-bottom:1px solid var(--ln)}.sec:last-child{border:0}
.sec h3{font-size:17px;font-weight:600;margin-bottom:10px}
.flow{display:flex;justify-content:space-around}
.fb{display:grid;gap:6px;justify-items:center;padding:6px 10px;font-size:15px}.fb.on{color:var(--co)}
.fb svg{width:46px;height:46px;fill:currentColor}
.row2{display:flex;align-items:center;justify-content:space-between}
.row2 b{display:block;font-size:17px;font-weight:600}
.step{width:44px;height:44px;font-size:26px;display:grid;place-items:center}.step:disabled{opacity:.35}
.sw{display:flex;gap:14px;align-items:center}
.dot{width:42px;height:42px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;color:#888;font-weight:700}
.dot.on{border-color:var(--ac);color:var(--ac)}
.bright{display:flex;align-items:center;gap:12px}.bright .i{color:var(--co);flex:none}
.sv{position:absolute;inset:0;background:#262628;z-index:9;display:flex;flex-direction:column}
.sv .top input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:19px;padding:0 8px}
.sr{flex:1;overflow-y:auto}
.hi{display:flex;gap:20px;align-items:center;width:100%;padding:16px 20px;text-align:left;font-size:17px}
.hi .i{color:var(--mu);flex:none}
mark{background:var(--acb);color:var(--ac);border-radius:3px;padding:0 2px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#e8e8ec;color:#111;padding:12px 16px;border-radius:12px;z-index:12}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
<symbol id="pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
<symbol id="mark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
<symbol id="aleft" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></symbol>
<symbol id="ajust" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></symbol>
</svg>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="txt"></main>
  <footer class="bot" id="bot"></footer>
  <div id="dim"></div>
  <div id="ov"></div>
  <div id="sv"></div>
  <div id="tt"></div>
</div>

<script>
/* ===== DATA (sample book; the real app reads chapter text files + document_chapters from the sandbox) ===== */
const BOOK='The Hollow Crown';
const P=['The lamp on the quay had been lit for an hour before anyone noticed the boat was gone. Marta counted the ropes twice and found them all in place.','“It didn’t drift,” she said. “Somebody took it, and they wanted us to see the lamp.”','Behind her the harbor clock struck nine, and the sound rolled out over the water and did not come back.','Tomas pulled his collar up and said nothing. He had learned that silence cost less than a wrong guess, and tonight every guess felt expensive.','Salt had dried white along the stairs. Someone had walked down them barefoot, carrying something heavy, and had not walked back up.','At the bottom the tide was low enough to show the old mooring stones. One of them had been scraped clean, as if a chain had been dragged across it.','“We should wake the harbor master,” Tomas said at last. Marta shook her head. “He lit the lamp,” she said.','Neither of them moved. Far out, past the breakwater, a second light blinked once and went dark.'];
const TT=['The Lamp on the Quay','A Rope Counted Twice','What the Water Kept','The Harbor Clock','Salt on the Stairs','An Honest Tide','The Second Lamp','Low Water'];
const CH=TT.map((t,i)=>({t:`Chapter ${i+1}: ${t}`,p:[...P.slice(i%4),...P.slice(0,i%4),...P]}));
const TH=[['#ffffff','#1a1a1a'],['#2b2b2e','#e0e0e0'],['#000000','#e6e6e6'],['#f1e4c3','#4a3a22']];
const ANN=[{ch:0,pi:1,q:'“It didn’t drift,” she said.',note:'Who took the boat?'},{ch:2,pi:4,q:'Salt had dried white along the stairs.',note:''}];

/* ===== STATE ===== */
const S={view:'read',ov:null,tab:'toc',ch:2,pg:0,flow:'scrolled',size:100,mg:2,al:'justify',th:2,custom:false,cbg:'#101820',ctx:'#d8e4f0',br:100,hist:['lamp','harbor clock','salt','low water','rope'],bm:[],q:'',res:[]};

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s),app=$('#app'),T=$('#txt');
const I=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const flow=()=>S.flow=='auto'?(innerWidth>=600?'paged':'scrolled'):S.flow;
let pages=[];
function paginate(){const cap=Math.round(1000/(S.size/100)),out=[[]];let n=0;CH[S.ch].p.forEach((p,i)=>{if(n+p.length>cap&&out[out.length-1].length){out.push([]);n=0}out[out.length-1].push(i);n+=p.length});return out}
const ratio=()=>flow()=='paged'?S.pg/Math.max(1,pages.length-1):T.scrollTop/Math.max(1,T.scrollHeight-T.clientHeight);
const toast=m=>{$('#tt').innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>$('#tt').innerHTML='',1800)};

/* ===== TEXT (flow: scrolled = continuous scroll, paged = page by page) ===== */
function drawText(keep=0){
  const c=CH[S.ch],paged=flow()=='paged';
  T.className=paged?'pg':'';
  if(paged){pages=paginate();S.pg=Math.min(pages.length-1,Math.round(keep*(pages.length-1)));pageHtml()}
  else{T.innerHTML=`<h2>${c.t}</h2>`+c.p.map(p=>`<p>${p}</p>`).join('');T.scrollTop=keep*(T.scrollHeight-T.clientHeight)}
  bottom();
}
function pageHtml(){const c=CH[S.ch];T.innerHTML=(S.pg==0?`<h2>${c.t}</h2>`:'')+pages[S.pg].map(i=>`<p>${c.p[i]}</p>`).join('')}
function step(d){
  S.pg+=d;
  if(S.pg<0){if(S.ch==0){S.pg=0;return}S.ch--;drawText(1);return}
  if(S.pg>=pages.length){if(S.ch==CH.length-1){S.pg=pages.length-1;return}S.ch++;drawText(0);return}
  pageHtml();bottom();
}
function goPara(pi){
  if(flow()=='paged'){S.pg=Math.max(0,pages.findIndex(g=>g.includes(pi)));pageHtml();bottom()}
  else{const el=T.querySelectorAll('p')[pi];if(el)T.scrollTop=el.offsetTop-T.offsetTop-16}
}

/* ===== CHROME: top bar, bottom scrubber ===== */
function drawTop(){$('#top').innerHTML=`<button class="ib" data-a="back" aria-label="Back">${I('back')}</button><h1 class="ell">${BOOK}</h1><button class="ib" data-a="search" aria-label="Search in book">${I('search')}</button><button class="ib" data-a="disp" aria-label="Display options">Aa</button><button class="ib" data-a="menu" aria-label="More">${I('dots')}</button>`}
function bottom(){const p=Math.round(ratio()*100);$('#bot').innerHTML=`<div class="bt"><span class="ell">${CH[S.ch].t}</span><span id="pc">${p}%</span></div><input type="range" id="sl" min="0" max="100" value="${p}" aria-label="Position in chapter">`}

/* ===== OVERLAYS: overflow menu, contents panel (3 tabs), display popup ===== */
const stepper=(l,v,a)=>`<div class="sec row2"><div><b>${l}</b><span class="mu">${v}</span></div><div><button class="step" data-a="${a}" data-v="-1">−</button><button class="step" data-a="${a}" data-v="1">+</button></div></div>`;
function panel(){
  const tabs=[['toc','list'],['ann','pencil'],['bm','mark']].map(([k,ic])=>`<button class="ptab${S.tab==k?' on':''}" data-a="tab" data-v="${k}" aria-label="${k}">${I(ic)}</button>`).join('');
  let b='';
  if(S.tab=='toc')b=CH.map((c,i)=>`<button class="li${i==S.ch?' on':''}" data-a="goch" data-v="${i}">${c.t}</button>`).join('');
  if(S.tab=='ann')b=ANN.map((a,i)=>`<button class="li" data-a="goann" data-v="${i}">${a.q}<small>${CH[a.ch].t}${a.note?' · '+a.note:''}</small></button>`).join('');
  if(S.tab=='bm')b=S.bm.length?S.bm.map((m,i)=>`<button class="li" data-a="gobm" data-v="${i}">${CH[m.ch].t}<small>${Math.round(m.r*100)}% of chapter</small></button>`).join(''):'<p class="empty">No bookmarks yet. Use the menu, then Add bookmark.</p>';
  return`<div class="sc dim" data-a="close"></div><aside class="pn"><div class="pt">${tabs}</div><div class="pb">${b}</div></aside>`;
}
function dispPop(){
  const fl=[['auto','<rect x="3" y="3" width="18" height="18" rx="3"/><text x="12" y="17.5" text-anchor="middle" font-size="15" font-weight="700" fill="#000">A</text>','Auto'],['paged','<rect x="2" y="5" width="6" height="14"/><rect x="9" y="3" width="6" height="18"/><rect x="16" y="5" width="6" height="14"/>','Paged'],['scrolled','<rect x="3" y="2" width="18" height="5"/><rect x="3" y="9" width="18" height="6"/><rect x="3" y="17" width="18" height="5"/>','Scrolled']];
  return`<div class="sc" data-a="close"></div><div class="disp">`
   +`<div class="sec"><h3 style="text-align:center">Flow</h3><div class="flow">${fl.map(([k,s,l])=>`<button class="fb${S.flow==k?' on':''}" data-a="flow" data-v="${k}"><svg viewBox="0 0 24 24">${s}</svg>${l}</button>`).join('')}</div></div>`
   +`<div class="sec bright">${I('sun')}<input type="range" id="br" min="20" max="100" value="${S.br}" aria-label="Brightness">${I('sun')}</div>`
   +`<div class="sec"><h3>Theme</h3><div class="sw">${TH.map(([b],i)=>`<button class="dot${S.th==i?' on':''}" data-a="th" data-v="${i}" style="background:${b}" aria-label="Theme ${i+1}">${S.th==i?'✓':''}</button>`).join('')}<button class="dot${S.custom?' on':''}" data-a="custom" aria-label="Custom colors">…</button></div>`
   +(S.custom?`<div class="row2" style="margin-top:12px"><label class="mu">Background <input type="color" data-c="cbg" value="${S.cbg}"></label><label class="mu">Text <input type="color" data-c="ctx" value="${S.ctx}"></label></div>`:'')+'</div>'
   +stepper('Text size',S.size+'%','size')
   +`<div class="sec row2"><div><b>Text align</b><span class="mu">${S.al=='justify'?'Justify':'Left'}</span></div><div><button class="step" data-a="al" data-v="left" aria-label="Align left">${I('aleft')}</button><button class="step" data-a="al" data-v="justify" aria-label="Justify" style="color:${S.al=='justify'?'var(--co)':'inherit'}">${I('ajust')}</button></div></div>`
   +stepper('Margin',S.mg+'%','mg')+'</div>';
}
function ov(){
  const o=S.ov;
  $('#ov').innerHTML=!o?'':o=='menu'?`<div class="sc" data-a="close"></div><div class="menu">${[['bmadd','Add bookmark'],['panel','Contents'],['settings','Settings']].map(([a,l])=>`<button class="mi" data-a="${a}">${l}</button>`).join('')}</div>`:o=='panel'?panel():dispPop();
}

/* ===== IN-BOOK SEARCH (recent searches, results with snippets) ===== */
function searchView(){
  $('#sv').innerHTML=S.view=='search'?`<div class="sv"><header class="top"><button class="ib" data-a="sback" aria-label="Back">${I('back')}</button><input id="q" placeholder="Search in book" value="${esc(S.q)}" autocomplete="off"><button class="ib" data-a="qclear" aria-label="Clear">${I('close')}</button></header><div class="sr" id="sr"></div></div>`:'';
  if(S.view=='search'){results();$('#q').focus()}
}
function results(){
  const q=S.q.trim().toLowerCase(),box=$('#sr');S.res=[];
  if(!q){box.innerHTML=S.hist.map(h=>`<button class="hi" data-a="hist" data-v="${esc(h)}">${I('clock')}<span>${esc(h)}</span></button>`).join('')+(S.hist.length?'<button class="hi" data-a="hclear"><span class="mu">Clear history</span></button>':'');return}
  CH.forEach((c,ci)=>c.p.slice(0,P.length).forEach((p,pi)=>{const k=p.toLowerCase().indexOf(q);if(k>=0&&S.res.length<40)S.res.push({ci,pi,a:p.slice(Math.max(0,k-30),k),m:p.slice(k,k+q.length),z:p.slice(k+q.length,k+q.length+50)})}));
  box.innerHTML=S.res.length?S.res.map((r,i)=>`<button class="li" data-a="gores" data-v="${i}">${esc(r.a)}<mark>${esc(r.m)}</mark>${esc(r.z)}<small>${CH[r.ci].t}</small></button>`).join(''):'<p class="empty">No matches in this book.</p>';
}

/* ===== STYLE (CSS variables, no re-render of the text) ===== */
function applyStyle(){
  const[b,t]=S.th<0?[S.cbg,S.ctx]:TH[S.th];
  app.style.setProperty('--rb',b);app.style.setProperty('--rt',t);app.style.setProperty('--sz',S.size/100);
  app.style.setProperty('--mg',S.mg+'%');app.style.setProperty('--al',S.al);$('#dim').style.opacity=(100-S.br)/125;
}

/* ===== ACTIONS ===== */
const toggleOv=o=>{S.ov=S.ov==o?null:o;ov()};
const redo=()=>{const r=ratio();applyStyle();drawText(r);ov()};
const act={
  back:()=>toast('Back to the library'),
  search:()=>{S.view='search';S.ov=null;ov();searchView()},
  sback:()=>{S.view='read';searchView()},
  qclear:()=>{S.q='';$('#q').value='';results();$('#q').focus()},
  hist:v=>{S.q=v;$('#q').value=v;results()},
  hclear:()=>{S.hist=[];results()},
  gores:v=>{const r=S.res[+v];S.ch=r.ci;S.view='read';drawText(0);searchView();goPara(r.pi)},
  disp:()=>toggleOv('disp'),menu:()=>toggleOv('menu'),panel:()=>{S.ov=null;toggleOv('panel')},close:()=>{S.ov=null;ov()},
  settings:()=>{S.ov=null;ov();toast('Opens app Settings')},
  bmadd:()=>{S.bm.push({ch:S.ch,r:ratio()});S.ov=null;ov();toast('Bookmark added')},
  tab:v=>{S.tab=v;ov()},
  goch:v=>{S.ch=+v;S.ov=null;drawText(0);ov()},
  goann:v=>{const a=ANN[+v];S.ch=a.ch;S.ov=null;drawText(0);ov();goPara(a.pi)},
  gobm:v=>{const m=S.bm[+v];S.ch=m.ch;S.ov=null;drawText(m.r);ov()},
  flow:v=>{const r=ratio();S.flow=v;drawText(r);ov()},
  th:v=>{S.th=+v;applyStyle();ov()},
  custom:()=>{S.custom=!S.custom;if(S.custom)S.th=-1;applyStyle();ov()},
  size:v=>{S.size=Math.max(60,Math.min(200,S.size+10*v));redo()},
  mg:v=>{S.mg=Math.max(0,Math.min(10,S.mg+v));redo()},
  al:v=>{S.al=v;applyStyle();ov()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(t){act[t.dataset.a](t.dataset.v);return}
  if(e.target.closest('#txt.pg')){const x=e.clientX-T.getBoundingClientRect().left,w=T.clientWidth;if(x<w/3)step(-1);else if(x>w*2/3)step(1)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id=='sl'){const v=+el.value/100;if(flow()=='paged'){S.pg=Math.round(v*(pages.length-1));pageHtml();$('#pc').textContent=el.value+'%'}else T.scrollTop=v*(T.scrollHeight-T.clientHeight)}
  else if(el.id=='br'){S.br=+el.value;applyStyle()}
  else if(el.dataset.c){S[el.dataset.c]=el.value;applyStyle()}
  else if(el.id=='q'){S.q=el.value;results()}
});
document.addEventListener('keydown',e=>{
  if(e.key=='Enter'&&e.target.id=='q'&&S.q.trim()){S.hist=[S.q.trim(),...S.hist.filter(h=>h!=S.q.trim())].slice(0,10);e.target.blur()}
});
T.addEventListener('scroll',()=>{const p=$('#pc'),s=$('#sl');if(!p||flow()=='paged')return;const v=Math.round(ratio()*100);p.textContent=v+'%';s.value=v});
drawTop();applyStyle();drawText(0);
</script>
</body>
</html>
